name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Tool versions are pinned so a new upstream release cannot turn a green CI red
# without a code change. Bump them together with the `lint` extra in pyproject.toml.
env:
  RUFF_VERSION: "0.16.1"
  CLANG_FORMAT_VERSION: "22.1.8"

jobs:
  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Lint
      run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github .

    - name: Check import sorting is stable
      run: uvx ruff@${{ env.RUFF_VERSION }} check --select I --diff .

  cpp:
    name: C++ (clang-format)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Check formatting
      run: |
        uvx clang-format@${{ env.CLANG_FORMAT_VERSION }} --dry-run --Werror \
          $(git ls-files '*.cpp' '*.h')
