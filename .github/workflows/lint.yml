name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Tool versions are pinned so a new upstream release cannot turn a green CI red
# without a code change. Bump them together with the `lint` extra in pyproject.toml.
env:
  RUFF_VERSION: "0.16.1"
  CLANG_FORMAT_VERSION: "22.1.8"

jobs:
  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Lint
      run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github .

    - name: Check import sorting is stable
      run: uvx ruff@${{ env.RUFF_VERSION }} check --select I --diff .

  cpp:
    name: C++ (clang-format)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Check formatting
      run: |
        git ls-files -z '*.cpp' '*.h' \
          | xargs -0 uvx clang-format@${{ env.CLANG_FORMAT_VERSION }} --dry-run --Werror

  types:
    name: Python (ty)
    runs-on: ubuntu-latest

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Cache CPM packages
      uses: actions/cache@v6
      with:
        path: ${{ env.CPM_SOURCE_CACHE }}
        key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
        restore-keys: |
          cpm-${{ runner.os }}-

    # Unlike the other two jobs this one needs a full C++ build, because the
    # reference stub is generated by nanobind_add_stub at build time.
    - name: Install
      run: uv sync --extra test --extra lint

    - name: Check vendored stub is up to date
      run: |
        generated="$(uv run python -c 'import protosaurus.protosaurus_ext as e, pathlib; print(pathlib.Path(e.__file__).parent)')/protosaurus_ext.pyi"
        diff -u "$generated" src/protosaurus/protosaurus_ext.pyi

    - name: Type check
      run: uv run ty check src/
