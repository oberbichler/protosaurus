name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to release, without a leading "v" (e.g. 0.4.1)'
        required: true
        type: string

permissions:
  contents: read

# Releases must never run concurrently: two runs would race on the version bump
# commit and could push conflicting tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
    # Pin the checkout to main so the outcome does not depend on which ref the
    # workflow happens to be dispatched from. fetch-depth 0 brings the tags in,
    # which the duplicate check below relies on.
    - uses: actions/checkout@v6
      with:
        ref: main
        fetch-depth: 0

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Validate version
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+((a|b|c|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'; then
          echo "::error::'$VERSION' is not a valid release version. Expected e.g. 0.4.1, without a leading 'v'."
          exit 1
        fi

    # A published version can never be replaced on PyPI, so refuse to reuse a tag
    # or release instead of force-pushing over it.
    - name: Refuse to overwrite an existing release
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
          echo "::error::Tag $VERSION already exists."
          exit 1
        fi
        if gh release view "$VERSION" >/dev/null 2>&1; then
          echo "::error::Release $VERSION already exists."
          exit 1
        fi

    # `uv version` updates both pyproject.toml and uv.lock. Editing only
    # pyproject.toml would leave the lockfile stale.
    - name: Bump version
      id: bump
      env:
        VERSION: ${{ inputs.version }}
      run: |
        uv version --no-sync "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Commit, tag and push
      env:
        VERSION: ${{ inputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add pyproject.toml uv.lock
        if git diff --cached --quiet; then
          echo "::error::Version is already $VERSION - nothing to bump."
          exit 1
        fi
        git commit -m "chore: bump version to $VERSION"
        git tag "$VERSION"
        git push origin main
        git push origin "$VERSION"

    - name: Create GitHub release
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "$VERSION" --title "$VERSION" --generate-notes


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    # Build exactly what was tagged, not whatever main looks like by now.
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare-release.outputs.version }}

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64

    # Build settings live in [tool.cibuildwheel] in pyproject.toml. Do not add
    # CIBW_* environment variables here: they override the pyproject values and
    # previously silenced the macOS x86_64 target.
    - uses: pypa/cibuildwheel@v3.4.1

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl


  build_sdist:
    name: Build SDist
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare-release.outputs.version }}

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Build SDist
      run: uv build --sdist

    - name: Upload SDist
      uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz


  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write
      attestations: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
