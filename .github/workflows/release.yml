name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to release, without a leading "v" (e.g. 0.4.1)'
        required: true
        type: string

permissions:
  contents: read

# Releases must never run concurrently: two runs could push conflicting tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
    # Pin the checkout to main so the outcome does not depend on which ref the
    # workflow happens to be dispatched from. fetch-depth 0 brings the tags in,
    # which the duplicate check below relies on.
    - uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0

    - name: Validate version
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+((a|b|c|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'; then
          echo "::error::'$VERSION' is not a valid release version. Expected e.g. 0.4.1, without a leading 'v'."
          exit 1
        fi

    # A published version can never be replaced on PyPI, so refuse to reuse a tag
    # or release instead of force-pushing over it.
    - name: Refuse to overwrite an existing release
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
          echo "::error::Tag $VERSION already exists."
          exit 1
        fi
        if gh release view "$VERSION" >/dev/null 2>&1; then
          echo "::error::Release $VERSION already exists."
          exit 1
        fi

    # The version is derived from this tag by setuptools_scm, so tagging is the
    # whole release action. Nothing is pushed to main, which the branch ruleset
    # forbids anyway ("changes must be made through a pull request").
    - name: Tag
      id: tag
      env:
        VERSION: ${{ inputs.version }}
      run: |
        git tag "$VERSION"
        git push origin "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Create GitHub release
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "$VERSION" --title "$VERSION" --generate-notes


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # aarch64 gets its own native runner instead of being emulated on the
        # x86_64 one. Emulating it made this job take about 1h50m, because the
        # whole protobuf build ran under QEMU.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
    # Build exactly what was tagged, not whatever main looks like by now.
    # fetch-depth 0 is required: setuptools_scm derives the version from the
    # tags, and a shallow clone would not carry them.
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare-release.outputs.version }}
        fetch-depth: 0

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    # Build settings live in [tool.cibuildwheel] in pyproject.toml. Do not add
    # CIBW_* environment variables here: they override the pyproject values and
    # previously silenced the macOS x86_64 target.
    - uses: pypa/cibuildwheel@v3.4.1

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl


  build_sdist:
    name: Build SDist
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare-release.outputs.version }}
        fetch-depth: 0

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Build SDist
      run: uv build --sdist

    - name: Upload SDist
      uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz


  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write
      attestations: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
