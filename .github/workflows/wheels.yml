name: Wheels

# Build verification only. Publishing to PyPI is owned by release.yml, which
# builds from the tag it creates. Adding a `release` trigger plus a publish job
# here would upload the same version twice and fail with HTTP 409.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    # fetch-depth 0 is required: setuptools_scm derives the version from the
    # tags, and a shallow clone would not carry them.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Build SDist
      run: uv build --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # aarch64 gets its own native runner instead of being emulated on the
        # x86_64 one. Emulating it made this job take about 1h50m, because the
        # whole protobuf build ran under QEMU.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
    # fetch-depth 0 is required: setuptools_scm derives the version from the
    # tags, and a shallow clone would not carry them.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    # Build settings live in [tool.cibuildwheel] in pyproject.toml. Do not add
    # CIBW_* environment variables here: they override the pyproject values and
    # previously silenced the macOS x86_64 target.
    - uses: pypa/cibuildwheel@v3.4.1

    - name: Verify clean directory
      run: git diff --exit-code
      shell: bash

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl
