[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=2.12.0", "setuptools-scm >=8"]
build-backend = "scikit_build_core.build"

[project]
name = "protosaurus"
# Derived from the git tag by setuptools_scm, see [tool.setuptools_scm] below.
# Releasing therefore means pushing a tag; there is no version to bump in a
# commit, which is what keeps release.yml from having to push to main.
dynamic = ["version"]
description = "Protocol Buffers at runtime"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Thomas Oberbichler", email = "thomas.oberbichler@gmail.com" },
]
classifiers = [
  "License :: OSI Approved :: ISC License (ISCL)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["click >= 8.1", "requests >= 2.31"]

[project.optional-dependencies]
test = ["pytest >=6.0", "deepdiff"]
lint = ["ruff >=0.16", "ty >=0.0.65"]

[project.scripts]
protosaurus = "protosaurus.cli:main"

[project.urls]
Homepage = "https://github.com/oberbichler/protosaurus"

[tool.scikit-build]
minimum-version = "0.4"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# An empty table is enough to activate setuptools_scm. Builds from an sdist do
# not need git: the version is baked into PKG-INFO when the sdist is created.
[tool.setuptools_scm]

[tool.cibuildwheel]
build = "cp312-*"
build-frontend = "build[uv]"
build-verbosity = 1
test-command = "pytest {project}/tests"
test-requires = ["pytest", "deepdiff"]

[tool.cibuildwheel.linux]
# Each Linux runner builds only its own architecture: the workflows provide one
# x86_64 and one aarch64 runner, so listing both here would emulate the other.
archs = ["auto"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by nanobind_add_stub at build time and vendored so type checkers can
# resolve the extension module. It must stay byte-identical to the generated file
# (enforced by the drift check in the lint workflow), so ruff must not rewrite it.
extend-exclude = ["src/protosaurus/protosaurus_ext.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["protosaurus"]

[tool.ty.src]
include = ["src"]
